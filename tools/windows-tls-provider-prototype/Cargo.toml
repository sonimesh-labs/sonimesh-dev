[package]
name = "windows-tls-provider-prototype"
default-run = "windows-tls-provider-prototype"
description = "Windows TLS 1.3 SPKI pin and exporter feasibility tool for SoniMesh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rcgen = { version = "0.13.2", default-features = false, features = ["ring"] }
rustls = { version = "=0.23.27", default-features = false, features = ["ring", "std"] }
sonimesh-app = { path = "../../crates/sonimesh-app" }
sonimesh-protocol = { path = "../../crates/sonimesh-protocol" }
x509-parser = "0.18.1"
zeroize = "1.9.0"

[lints]
workspace = true
