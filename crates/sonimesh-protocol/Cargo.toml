[package]
name = "sonimesh-protocol"
description = "Bounded SoniMesh wire parsing and protocol primitives"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["zeroize"] }
hkdf = "0.13.0"
hmac = "0.13.0"
prost = "0.14.4"
sha2 = { version = "0.11.0", default-features = false }
zeroize = { version = "1.9.0", default-features = false }

[build-dependencies]
prost-build = "0.14.4"
protoc-bin-vendored = "3.2.0"

[lints]
workspace = true
