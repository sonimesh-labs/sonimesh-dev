[package]
name = "sonimesh-network"
description = "SoniMesh authenticated media ingress and network boundaries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rustls = { version = "=0.23.27", default-features = false, features = ["ring", "std"] }
sonimesh-protocol = { path = "../sonimesh-protocol" }
x509-parser = { version = "0.18.1", default-features = false, features = ["verify"] }
zeroize = "1.9.0"

[dev-dependencies]
rcgen = { version = "0.13.2", default-features = false, features = ["ring"] }

[lints]
workspace = true

