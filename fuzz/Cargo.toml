[package]
name = "sonimesh-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
opus = "0.3.1"
sonimesh-audio = { path = "../crates/sonimesh-audio" }
sonimesh-app = { path = "../crates/sonimesh-app" }
