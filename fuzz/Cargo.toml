[package]
name = "sonimesh-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
sonimesh-network = { path = "../crates/sonimesh-network" }
sonimesh-protocol = { path = "../crates/sonimesh-protocol" }

[workspace]
members = ["."]

[[bin]]
name = "control_frame"
path = "fuzz_targets/control_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "media_packet"
path = "fuzz_targets/media_packet.rs"
test = false
doc = false
bench = false

[[bin]]
name = "protected_media_ingress"
path = "fuzz_targets/protected_media_ingress.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pairing_binding"
path = "fuzz_targets/pairing_binding.rs"
test = false
doc = false
bench = false

[[bin]]
name = "untrusted_control_stream"
path = "fuzz_targets/untrusted_control_stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "negotiation"
path = "fuzz_targets/negotiation.rs"
test = false
doc = false
bench = false
