name: core-ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check workspace architecture boundaries
        run: |
          python tools/check_workspace_boundaries.py --self-test
          python tools/check_workspace_boundaries.py
          python tools/check_fuzz_targets.py --self-test
          python tools/check_fuzz_targets.py
          python tools/check_adr_index.py --self-test
          python tools/check_adr_index.py
          python tools/check_preview_alignment.py --self-test
          python tools/check_preview_alignment.py
          python tools/check_pairing_vectors.py --self-test
          python tools/check_pairing_vectors.py
          python tools/check_android_capture_boundary.py --self-test
          python tools/check_android_capture_boundary.py
          python tools/check_output_soak_log.py --self-test
          python tools/check_output_realtime_boundary.py --self-test
          python tools/check_output_realtime_boundary.py
          python tools/check_output_lifecycle_log.py --self-test
          python tools/check_output_recovery_log.py --self-test
          python tools/android_capture_preflight.py --self-test
          python tools/check_android_capture_record.py --self-test
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Lint all targets
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --all-targets --all-features
      - name: Run Windows TLS provider spike
        if: runner.os == 'Windows'
        run: cargo run -p windows-tls-provider-prototype

  desktop-ui:
    name: Desktop UI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: apps/desktop-ui/package-lock.json
      - name: Install desktop UI dependencies
        working-directory: apps/desktop-ui
        run: npm ci
      - name: Test desktop UI
        working-directory: apps/desktop-ui
        run: npm test
      - name: Build desktop UI
        working-directory: apps/desktop-ui
        run: npm run build

  fuzz:
    name: Rust fuzz smoke (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-18
          components: rust-src,rustfmt
      - name: Install cargo-fuzz
        run: cargo +nightly-2026-07-18 install cargo-fuzz --version 0.13.2 --locked
      - name: Check fuzz target formatting
        run: cargo +nightly-2026-07-18 fmt --manifest-path fuzz/Cargo.toml --all -- --check
      - name: Lint fuzz targets
        run: cargo +nightly-2026-07-18 clippy --manifest-path fuzz/Cargo.toml --bins -- -D warnings
      - name: Type-check fuzz targets
        working-directory: fuzz
        run: cargo +nightly-2026-07-18 fuzz check
      - name: Run finite fuzz smoke
        working-directory: fuzz
        run: |
          cargo +nightly-2026-07-18 fuzz run control_frame -- -runs=512 -max_len=66052 -timeout=5
          cargo +nightly-2026-07-18 fuzz run media_packet -- -runs=512 -max_len=1264 -timeout=5
          cargo +nightly-2026-07-18 fuzz run protected_media_ingress -- -runs=512 -max_len=1264 -timeout=5
          cargo +nightly-2026-07-18 fuzz run pairing_binding -- -runs=512 -max_len=4096 -timeout=5
          cargo +nightly-2026-07-18 fuzz run untrusted_control_stream -- -runs=512 -max_len=65540 -timeout=5
          cargo +nightly-2026-07-18 fuzz run negotiation -- -runs=512 -max_len=66052 -timeout=5
          cargo +nightly-2026-07-18 fuzz run stream_decode_worker -- -runs=512 -max_len=64 -timeout=5

  android:
    name: Android capture bootstrap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install Android build components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"
      - name: Build Android capture bootstrap
        working-directory: apps/android
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug :tls-provider-spike:assembleDebugAndroidTest --no-daemon
