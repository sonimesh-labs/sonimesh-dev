name: core-ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check workspace architecture boundaries
        run: |
          python tools/check_workspace_boundaries.py --self-test
          python tools/check_workspace_boundaries.py
          python tools/check_android_capture_boundary.py --self-test
          python tools/check_android_capture_boundary.py
          python tools/check_output_soak_log.py --self-test
          python tools/check_output_realtime_boundary.py --self-test
          python tools/check_output_realtime_boundary.py
          python tools/check_output_lifecycle_log.py --self-test
          python tools/check_output_recovery_log.py --self-test
          python tools/android_capture_preflight.py --self-test
          python tools/check_android_capture_record.py --self-test
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Lint all targets
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --all-targets --all-features
      - name: Run Windows TLS provider spike
        if: runner.os == 'Windows'
        run: cargo run -p windows-tls-provider-prototype

  android:
    name: Android capture bootstrap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install Android build components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;34.0.0"
      - name: Build Android capture bootstrap
        working-directory: apps/android
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug :tls-provider-spike:assembleDebugAndroidTest --no-daemon
