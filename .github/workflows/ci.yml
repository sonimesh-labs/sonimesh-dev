name: core-ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # The bundled libopus CMakeLists uses a pre-3.5 policy floor; CMake 4.x
  # needs this variable to configure, so it must cover the workspace test and
  # clippy steps that compile the native opus-codec-prototype member and the
  # fuzz smoke step that compiles the native opus decode fuzz target.
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check workspace architecture boundaries
        run: |
          python tools/check_workspace_boundaries.py --self-test
          python tools/check_workspace_boundaries.py
          python tools/check_workspace_members.py --self-test
          python tools/check_workspace_members.py
          python tools/check_doc_links.py --self-test
          python tools/check_doc_links.py
          python tools/check_doc_dates.py --self-test
          python tools/check_doc_dates.py
          python tools/check_fuzz_targets.py --self-test
          python tools/check_fuzz_targets.py
          python tools/check_adr_index.py --self-test
          python tools/check_adr_index.py
          python tools/check_preview_alignment.py --self-test
          python tools/check_preview_alignment.py
          python tools/check_pairing_vectors.py --self-test
          python tools/check_pairing_vectors.py
          python tools/check_pairing_qr_vectors.py --self-test
          python tools/check_pairing_qr_vectors.py
          python tools/check_pairing_proof_frame.py --self-test
          python tools/check_pairing_proof_frame.py
          python tools/check_control_frame_vectors.py --self-test
          python tools/check_control_frame_vectors.py
          python tools/check_media_header_vectors.py --self-test
          python tools/check_media_header_vectors.py
          python tools/check_media_key_vectors.py --self-test
          python tools/check_media_key_vectors.py
          python tools/check_negotiation_vectors.py --self-test
          python tools/check_negotiation_vectors.py
          python tools/check_media_crypto_vectors.py --self-test
          python tools/check_media_crypto_vectors.py
          python tools/check_sequence_replay.py --self-test
          python tools/check_sequence_replay.py
          python tools/check_media_limits.py --self-test
          python tools/check_media_limits.py
          python tools/check_android_capture_boundary.py --self-test
          python tools/check_android_capture_boundary.py
          python tools/check_output_soak_log.py --self-test
          python tools/check_output_realtime_boundary.py --self-test
          python tools/check_output_realtime_boundary.py
          python tools/check_output_lifecycle_log.py --self-test
          python tools/check_output_recovery_log.py --self-test
          python tools/android_capture_preflight.py --self-test
          python tools/android_discovery_preflight.py --self-test
          python tools/check_android_capture_record.py --self-test
          python tools/check_ci_wiring.py --self-test
          python tools/check_ci_wiring.py
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Lint all targets
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --all-targets --all-features
      - name: Run deterministic network simulator smoke
        run: cargo run -p sonimesh-network-simulator
      - name: Run Windows TLS provider spike
        if: runner.os == 'Windows'
        run: cargo run -p windows-tls-provider-prototype
      - name: Run Windows credential store prototype
        if: runner.os == 'Windows'
        run: cargo run -p windows-credential-prototype
      - name: Run Windows Opus codec prototype
        if: runner.os == 'Windows'
        run: cargo run -p opus-codec-prototype

  desktop-ui:
    name: Desktop UI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: apps/desktop-ui/package-lock.json
      - name: Install desktop UI dependencies
        working-directory: apps/desktop-ui
        run: npm ci
      - name: Test desktop UI
        working-directory: apps/desktop-ui
        run: npm test
      - name: Build desktop UI
        working-directory: apps/desktop-ui
        run: npm run build

  fuzz:
    name: Rust fuzz smoke (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-18
          components: rust-src,rustfmt
      - name: Install cargo-fuzz
        run: cargo +nightly-2026-07-18 install cargo-fuzz --version 0.13.2 --locked
      - name: Check fuzz target formatting
        run: cargo +nightly-2026-07-18 fmt --manifest-path fuzz/Cargo.toml --all -- --check
      - name: Lint fuzz targets
        run: cargo +nightly-2026-07-18 clippy --manifest-path fuzz/Cargo.toml --bins -- -D warnings
      - name: Type-check fuzz targets
        working-directory: fuzz
        run: cargo +nightly-2026-07-18 fuzz check
      - name: Run finite fuzz smoke
        working-directory: fuzz
        run: |
          cargo +nightly-2026-07-18 fuzz run control_frame -- -runs=512 -max_len=66052 -timeout=5
          cargo +nightly-2026-07-18 fuzz run adaptive_jitter_target -- -runs=512 -max_len=64 -timeout=5

          cargo +nightly-2026-07-18 fuzz run media_packet -- -runs=512 -max_len=1264 -timeout=5
          cargo +nightly-2026-07-18 fuzz run nominal_resampler -- -runs=512 -max_len=1024 -timeout=5
          cargo +nightly-2026-07-18 fuzz run polyphase_resampler -- -runs=512 -max_len=1024 -timeout=5
          cargo +nightly-2026-07-18 fuzz run channel_mapper -- -runs=512 -max_len=1024 -timeout=5
          cargo +nightly-2026-07-18 fuzz run peak_limiter -- -runs=512 -max_len=1024 -timeout=5
          cargo +nightly-2026-07-18 fuzz run drift_controller -- -runs=512 -max_len=1024 -timeout=5
          cargo +nightly-2026-07-18 fuzz run drift_scenario -- -runs=512 -max_len=1024 -timeout=5
          cargo +nightly-2026-07-18 fuzz run mixer_drift_scenario -- -runs=512 -max_len=1024 -timeout=5
          cargo +nightly-2026-07-18 fuzz run fixed_slot_mixer -- -runs=512 -max_len=1024 -timeout=5
          cargo +nightly-2026-07-18 fuzz run mixer_membership -- -runs=512 -max_len=1024 -timeout=5
          cargo +nightly-2026-07-18 fuzz run mixer_jitter_scheduler -- -runs=512 -max_len=1024 -timeout=5
          cargo +nightly-2026-07-18 fuzz run mixer_jitter_scheduler_4s -- -runs=512 -max_len=1024 -timeout=5
          cargo +nightly-2026-07-18 fuzz run mixer_controller_membership -- -runs=512 -max_len=1024 -timeout=5
          cargo +nightly-2026-07-18 fuzz run multi_stream -- -runs=512 -max_len=1024 -timeout=5
          cargo +nightly-2026-07-18 fuzz run multi_stream_jitter_target -- -runs=512 -max_len=1024 -timeout=5
          cargo +nightly-2026-07-18 fuzz run jitter_scheduler -- -runs=512 -max_len=1024 -timeout=5
          cargo +nightly-2026-07-18 fuzz run jitter_target -- -runs=512 -max_len=1024 -timeout=5
          cargo +nightly-2026-07-18 fuzz run target_gated_playout -- -runs=512 -max_len=1024 -timeout=5
          cargo +nightly-2026-07-18 fuzz run mixer_membership_scenario -- -runs=512 -max_len=1024 -timeout=5
          cargo +nightly-2026-07-18 fuzz run protected_media_ingress -- -runs=512 -max_len=1264 -timeout=5
          cargo +nightly-2026-07-18 fuzz run pairing_binding -- -runs=512 -max_len=4096 -timeout=5
          cargo +nightly-2026-07-18 fuzz run pairing_qr -- -runs=512 -max_len=1024 -timeout=5
          cargo +nightly-2026-07-18 fuzz run pairing_proof -- -runs=512 -max_len=128 -timeout=5
          cargo +nightly-2026-07-18 fuzz run untrusted_control_stream -- -runs=512 -max_len=65540 -timeout=5
          cargo +nightly-2026-07-18 fuzz run negotiation -- -runs=512 -max_len=66052 -timeout=5
          cargo +nightly-2026-07-18 fuzz run stream_decode_worker -- -runs=512 -max_len=64 -timeout=5
          cargo +nightly-2026-07-18 fuzz run stream_format_adapter -- -runs=512 -max_len=1024 -timeout=5
          cargo +nightly-2026-07-18 fuzz run native_opus_decode -- -runs=512 -max_len=1200 -timeout=5
          cargo +nightly-2026-07-18 fuzz run control_stream_coordinator -- -runs=512 -max_len=1024 -timeout=5
          cargo +nightly-2026-07-18 fuzz run control_to_mixer -- -runs=512 -max_len=1024 -timeout=5
          cargo +nightly-2026-07-18 fuzz run replay_window -- -runs=512 -max_len=1024 -timeout=5
          cargo +nightly-2026-07-18 fuzz run pairing_invitation -- -runs=512 -max_len=1024 -timeout=5
          cargo +nightly-2026-07-18 fuzz run reconnect_grace -- -runs=512 -max_len=1024 -timeout=5
          cargo +nightly-2026-07-18 fuzz run mixer_output_controller -- -runs=512 -max_len=1024 -timeout=5
          cargo +nightly-2026-07-18 fuzz run mixer_membership_controller -- -runs=512 -max_len=1024 -timeout=5
          cargo +nightly-2026-07-18 fuzz run receiver_output_controller -- -runs=512 -max_len=1024 -timeout=5
          cargo +nightly-2026-07-18 fuzz run pcm_render_source -- -runs=512 -max_len=1024 -timeout=5
          cargo +nightly-2026-07-18 fuzz run receiver_pipeline -- -runs=512 -max_len=1024 -timeout=5
          cargo +nightly-2026-07-18 fuzz run udp_receiver_pipeline -- -runs=512 -max_len=1024 -timeout=5
          cargo +nightly-2026-07-18 fuzz run media_session_sender -- -runs=512 -max_len=1024 -timeout=5
          cargo +nightly-2026-07-18 fuzz run export_retention_journal -- -runs=512 -max_len=1024 -timeout=5
          cargo +nightly-2026-07-18 fuzz run media_session_allocator -- -runs=512 -max_len=64 -timeout=5

  android:
    name: Android capture bootstrap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install Android build components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"
      - name: Build Android capture bootstrap
        working-directory: apps/android
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug :tls-provider-spike:assembleDebugAndroidTest --no-daemon
