[workspace]
members = [
    "crates/sonimesh-app",
    "crates/sonimesh-audio",
    "crates/sonimesh-diagnostics",
    "crates/sonimesh-network",
    "crates/sonimesh-platform",
    "crates/sonimesh-protocol",
    "tools/network-simulator",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
doc_markdown = "allow"
